name: Dev Release (Dual Screen)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  # ── Read version once, share across jobs ────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      tag: ${{ steps.get.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract firmware version
        id: get
        run: |
          VERSION=$(grep '#define FIRMWARE_VERSION' include/ui_common.h | sed 's/.*"\(.*\)".*/\1/')
          SHORT_SHA=${GITHUB_SHA::7}
          TAG="v${VERSION}-nightly.${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG"         >> $GITHUB_OUTPUT
          echo "Version: $VERSION  Tag: $TAG"

  # ── Build both screen sizes in parallel ─────────────────────────────────────
  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: esp32_4inch
            label: 4inch
          - env: esp32_7inch
            label: 7inch

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-v3-${{ hashFiles('**/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-v3-

      - name: Install PlatformIO + esptool
        run: pip install platformio esptool

      - name: Build ${{ matrix.label }}
        run: pio run -e ${{ matrix.env }}

      - name: Create merged binary
        run: |
          python -m esptool --chip esp32p4 merge_bin \
            -o firmware-${{ matrix.label }}-merged.bin \
            --flash_mode qio --flash_size 16MB \
            0x0     .pio/build/${{ matrix.env }}/bootloader.bin \
            0x8000  .pio/build/${{ matrix.env }}/partitions.bin \
            0x10000 .pio/build/${{ matrix.env }}/firmware.bin

      - name: Stage release assets
        run: |
          cp .pio/build/${{ matrix.env }}/firmware.bin    firmware-${{ matrix.label }}.bin
          cp .pio/build/${{ matrix.env }}/bootloader.bin  bootloader-${{ matrix.label }}.bin
          cp .pio/build/${{ matrix.env }}/partitions.bin  partitions-${{ matrix.label }}.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.label }}
          path: |
            firmware-${{ matrix.label }}.bin
            firmware-${{ matrix.label }}-merged.bin
            bootloader-${{ matrix.label }}.bin
            partitions-${{ matrix.label }}.bin
          retention-days: 30

  # ── Assemble and publish release ─────────────────────────────────────────────
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Delete previous dev release (rolling tag)
        run: |
          gh release delete dev-latest --yes 2>/dev/null || true
          git push origin :refs/tags/dev-latest 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Dev Build ${{ needs.version.outputs.version }} (${{ github.sha != '' && github.sha || 'manual' }})"
          prerelease: true
          body: |
            **Automated dev build** — built from `dev` branch @ `${{ github.sha }}`

            > ⚠️ This is a development build. It may be unstable.

            ## Firmware Files

            | File | Screen | Use |
            |------|--------|-----|
            | `firmware-4inch.bin` | 4" 800×480 | OTA update from device |
            | `firmware-7inch.bin` | 7" 1024×600 | OTA update from device |
            | `firmware-4inch-merged.bin` | 4" | Full flash (esptool / web installer) |
            | `firmware-7inch-merged.bin` | 7" | Full flash (esptool / web installer) |

            ## Flash with esptool
            ```bash
            # 4-inch board
            python -m esptool --chip esp32p4 write_flash 0x0 firmware-4inch-merged.bin

            # 7-inch board
            python -m esptool --chip esp32p4 write_flash 0x0 firmware-7inch-merged.bin
            ```
          files: |
            release-assets/firmware-4inch.bin
            release-assets/firmware-7inch.bin
            release-assets/firmware-4inch-merged.bin
            release-assets/firmware-7inch-merged.bin
            release-assets/bootloader-4inch.bin
            release-assets/partitions-4inch.bin
            release-assets/bootloader-7inch.bin
            release-assets/partitions-7inch.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
