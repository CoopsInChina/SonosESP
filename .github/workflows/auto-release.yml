name: Auto Release (Dual Screen)

on:
  push:
    paths:
      - 'include/ui_common.h'
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Read version and check whether to proceed ────────────────────────────────
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract firmware version
        id: get
        run: |
          VERSION=$(grep '#define FIRMWARE_VERSION' include/ui_common.h | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check skip conditions
        id: check
        run: |
          VERSION="${{ steps.get.outputs.version }}"
          SKIP=false

          # Skip RC / dev builds — only release clean version tags (e.g. 1.6.3)
          if echo "$VERSION" | grep -qE '(RC|rc|dev|nightly|beta|alpha)'; then
            echo "⚠️  Pre-release version ($VERSION) — skipping stable auto-release"
            SKIP=true
          fi

          # Skip if this release tag already exists
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists — skipping"
            SKIP=true
          fi

          echo "skip=$SKIP" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build both screen sizes in parallel ──────────────────────────────────────
  build:
    needs: preflight
    if: needs.preflight.outputs.skip == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: esp32_4inch
            label: 4inch
          - env: esp32_7inch
            label: 7inch

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-v3-${{ hashFiles('**/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-v3-

      - name: Install PlatformIO + esptool
        run: pip install platformio esptool

      - name: Build ${{ matrix.label }}
        run: pio run -e ${{ matrix.env }}

      - name: Create merged binary
        run: |
          python -m esptool --chip esp32p4 merge_bin \
            -o firmware-${{ matrix.label }}-merged.bin \
            --flash_mode qio --flash_size 16MB \
            0x0     .pio/build/${{ matrix.env }}/bootloader.bin \
            0x8000  .pio/build/${{ matrix.env }}/partitions.bin \
            0x10000 .pio/build/${{ matrix.env }}/firmware.bin

      - name: Stage assets
        run: |
          cp .pio/build/${{ matrix.env }}/firmware.bin    firmware-${{ matrix.label }}.bin
          cp .pio/build/${{ matrix.env }}/bootloader.bin  bootloader-${{ matrix.label }}.bin
          cp .pio/build/${{ matrix.env }}/partitions.bin  partitions-${{ matrix.label }}.bin
          zip firmware-${{ matrix.label }}.zip \
            bootloader-${{ matrix.label }}.bin \
            partitions-${{ matrix.label }}.bin \
            firmware-${{ matrix.label }}.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.label }}
          path: |
            firmware-${{ matrix.label }}.bin
            firmware-${{ matrix.label }}-merged.bin
            firmware-${{ matrix.label }}.zip
            bootloader-${{ matrix.label }}.bin
            partitions-${{ matrix.label }}.bin
          retention-days: 30

  # ── Publish release ───────────────────────────────────────────────────────────
  release:
    needs: [preflight, build]
    if: needs.preflight.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          name: v${{ needs.preflight.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Firmware Files

            | File | Screen | Use |
            |------|--------|-----|
            | `firmware-4inch.bin` | 4" 800×480 (GUITION JC4880P433C) | OTA update from device |
            | `firmware-7inch.bin` | 7" 1024×600 (GUITION JC1060P470C) | OTA update from device |
            | `firmware-4inch-merged.bin` | 4" | Single-file flash (esptool / web installer) |
            | `firmware-7inch-merged.bin` | 7" | Single-file flash (esptool / web installer) |

            ## Flash with esptool
            ```bash
            # 4-inch board
            python -m esptool --chip esp32p4 write_flash 0x0 firmware-4inch-merged.bin

            # 7-inch board
            python -m esptool --chip esp32p4 write_flash 0x0 firmware-7inch-merged.bin
            ```

            ## Web Installer
            Visit https://CoopsInChina.github.io/SonosESP/ to flash via browser.
          files: |
            release-assets/firmware-4inch.bin
            release-assets/firmware-7inch.bin
            release-assets/firmware-4inch-merged.bin
            release-assets/firmware-7inch-merged.bin
            release-assets/firmware-4inch.zip
            release-assets/firmware-7inch.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
