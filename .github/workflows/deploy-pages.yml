name: Deploy Web Installer

on:
  push:
    branches: [ release ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract firmware version
        id: get_version
        run: |
          VERSION=$(grep '#define FIRMWARE_VERSION' include/ui_common.h | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-v3-${{ hashFiles('**/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-v3-

      - name: Install PlatformIO + esptool
        run: pip install platformio esptool

      - name: Build 4-inch firmware
        run: |
          pio run -e esp32_4inch
          mkdir -p /tmp/fw/4inch
          cp .pio/build/esp32_4inch/bootloader.bin /tmp/fw/4inch/
          cp .pio/build/esp32_4inch/partitions.bin /tmp/fw/4inch/
          cp .pio/build/esp32_4inch/firmware.bin   /tmp/fw/4inch/

      - name: Build 7-inch firmware
        run: |
          pio run -e esp32_7inch
          mkdir -p /tmp/fw/7inch
          cp .pio/build/esp32_7inch/bootloader.bin /tmp/fw/7inch/
          cp .pio/build/esp32_7inch/partitions.bin /tmp/fw/7inch/
          cp .pio/build/esp32_7inch/firmware.bin   /tmp/fw/7inch/

      - name: Assemble web-installer directory
        run: |
          mkdir -p web-installer

          # 4-inch firmware (merged for web installer, raw for OTA)
          python -m esptool --chip esp32p4 merge-bin \
            -o web-installer/firmware-4inch-merged.bin \
            --flash-mode qio --flash-size 16MB \
            0x0     /tmp/fw/4inch/bootloader.bin \
            0x8000  /tmp/fw/4inch/partitions.bin \
            0x10000 /tmp/fw/4inch/firmware.bin

          # 7-inch firmware
          python -m esptool --chip esp32p4 merge-bin \
            -o web-installer/firmware-7inch-merged.bin \
            --flash-mode qio --flash-size 16MB \
            0x0     /tmp/fw/7inch/bootloader.bin \
            0x8000  /tmp/fw/7inch/partitions.bin \
            0x10000 /tmp/fw/7inch/firmware.bin

          # Individual binaries
          cp /tmp/fw/4inch/bootloader.bin  web-installer/bootloader.bin
          cp /tmp/fw/4inch/partitions.bin  web-installer/partitions.bin
          cp /tmp/fw/4inch/firmware.bin    web-installer/firmware-4inch.bin
          cp /tmp/fw/7inch/firmware.bin    web-installer/firmware-7inch.bin

          # Update manifest versions
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" web-installer/manifest-4inch.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" web-installer/manifest-7inch.json

          echo "Web installer contents:"
          ls -lh web-installer/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web-installer'
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
